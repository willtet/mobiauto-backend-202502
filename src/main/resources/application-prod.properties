spring.application.name=mobiauto-backend-202502

spring.datasource.url=${DB_DATABASE_URL}
spring.datasource.username=${DB_DATABASE_USER}
spring.datasource.password=${DB_DATABASE_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true



jjwt.secret = ${JWT_SECRET}
jjwt.jwtExpirationMs=${JWT_EXPIRATION_MS}