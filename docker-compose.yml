services:
  postgres:
    image: postgres:13
    container_name: mobiauto-postgres
    environment:
      POSTGRES_DB: mobiauto
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: mobiauto-api
    environment:
      DB_DATABASE_URL: jdbc:postgresql://postgres:5432/mobiauto
      DB_DATABASE_USER: admin
      DB_DATABASE_PASS: admin
      JWT_SECRET: 
      JWT_EXPIRATION_MS: 3600000
    ports:
      - "8080:8080"
    depends_on:
      - postgres